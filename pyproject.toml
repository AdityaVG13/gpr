[project]
name = "goal-ratchet"
version = "0.1.2"
description = "Goal-driven, audit-verified iterative agent loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aditya", email = "adityavgcode@gmail.com" }]
keywords = ["llm", "agent", "loop", "ralph", "codex", "claude", "automation", "prd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AdityaVG13/GPR"
Issues = "https://github.com/AdityaVG13/GPR/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 60

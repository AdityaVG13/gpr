version: 2

updates:
  # GitHub Actions: pin upgrades to actions/* + third-party uses
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python deps in pyproject.toml. Currently runtime is stdlib-only;
  # this catches dev (pytest, pytest-timeout) updates so the test
  # surface stays current.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
      include: "scope"
